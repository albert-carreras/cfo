# cfo production stack on au.
#   - app: published only on host loopback for the outbound Cloudflare Tunnel
#   - app_setup: runs drizzle migrations once, then exits
#   - cron: reaches the app over the private Compose network
#   - db: postgres on an external volume so the deploy lifecycle can never drop it
# Driven by ./stack (prod init | prod deploy). Copy .env.server.example -> .env first.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    logging: *default-logging
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    # The host connector can reach the origin, but the LAN/public Internet
    # cannot: Docker binds the port only on au's loopback interface.
    ports:
      - "127.0.0.1:3222:3222"
    depends_on:
      db:
        condition: service_healthy
      app_setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3222/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Daily price/FX update: busybox crond hits the app's cron route over the
  # private Compose network (see infra/cron/crontab).
  cron:
    image: alpine:3.21
    logging: *default-logging
    restart: unless-stopped
    # Bind-mounted files retain the host UID. BusyBox rejects root's crontab
    # unless root owns it, so install a root-owned copy before starting crond.
    # Log to stderr so scheduled runs and parse errors reach Docker logs.
    command:
      - sh
      - -c
      - |
        cp /config/crontab /etc/crontabs/root
        chmod 600 /etc/crontabs/root
        exec crond -f -d 8
    volumes:
      - ./infra/cron/crontab:/config/crontab:ro
    depends_on:
      app:
        condition: service_healthy

  app_setup:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: jobs
    command: npm run db:migrate
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot manual seed — never auto-started (run via `./stack prod seed`). The
  # real-data file is MOUNTED from the host, never baked into the image or
  # committed to git, so you edit scripts/seed.local.ts on the box and re-run
  # without a rebuild. seed.ts is idempotent: it WIPES then reloads.
  seed:
    profiles: ["seed"]
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: jobs
    command: npm run seed
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./scripts/seed.local.ts:/app/scripts/seed.local.ts:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    logging: *default-logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    external: true
    name: ${CFO_POSTGRES_VOLUME:-cfo_postgres_data}
